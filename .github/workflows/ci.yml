name: CI
on:
  push: { branches: [Main, main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["54329:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-secret
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key-not-a-secret
      APP_BASE_URL: http://localhost:3100
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:54329/wbh_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Load migrations into a fresh database
        run: |
          psql -h 127.0.0.1 -p 54329 -U postgres -c "create database wbh_test"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54329 -U postgres -d wbh_test -f tests/integration/support/supabase-shim.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54329 -U postgres -d wbh_test -f "$f"; done
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
